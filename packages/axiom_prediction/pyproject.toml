[project]
name = "axiom-predictor"
version = "0.1.0"
description = "SAT-core axiom prediction and guided connection search."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = ["connections[sat]", "numpy", "torch>=2.2"]

[project.optional-dependencies]
tracking = ["wandb"]

[project.scripts]
axiom-predictor = "axiom_prediction.cli:main"

[tool.uv.sources]
connections = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["axiom_prediction", "axiom_prediction.models", "axiom_prediction.representation"]
package-dir = { axiom_prediction = "." }
