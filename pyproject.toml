[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mypycop"
version = "0.1.0"
description = "Classical connection prover experiments and strategy comparison tooling"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Martin Fixman", email = "msf43@cam.ac.uk" },
]
dependencies = [
    "python-sat",
    "pydical @ git+https://github.com/mfixman/pydical.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=6,<7",
]

[project.scripts]
pycop = "pycop:main"
compare-strategies = "compare_strategies:main"

[tool.setuptools]
include-package-data = true
py-modules = ["cli", "pycop", "compare_strategies"]

[tool.setuptools.packages.find]
include = ["connections*", "strategies*"]
exclude = ["tests*"]
